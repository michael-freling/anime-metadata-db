# Authored override — 2011 catalogue import. Holds only the structure the
# open sources cannot express; `builder build` fills the facts into data/.
# Never hand-edit data/.
series:
  id: thundercats
  titles:
    original: サンダーキャッツ
    translations: { ja-Latn: Thundercats }
  seasons:
    - id: thundercats-s1
      number: 1
    - id: thundercats-s2
      number: 2
# No continuous absoluteNumber. The seasons above are separate adaptations of
# one work (1985, 2011), not one run, so numbering them end to end would
# assert a continuity that does not exist.
