# Authored override (Fate) — a multi-storyline brand, so a Franchise wrapping
# several Series. Fate/Zero is one linear story (numbered); Fate/stay night
# adapts parallel routes, so it has no absoluteNumber and sorts by release date.
#
# Franchise and Series overrides live together under overrides/series/. Node ids
# are prefixed with their owning series id.
franchise:
  id: fate
  titles: { original: フェイト, translations: { en: Fate } }
  series:
    - id: fate-stay-night
      titles: { original: Fate/stay night }
      seasons:
        - id: fate-stay-night-s1
          number: 1
          # Authored: upstream does not list this under the series' own title, so
          # the build cannot resolve it. Everywhere else the id is resolved.
          externalIds: { anilistId: 356 } # Fate/stay night (2006)
        - id: fate-stay-night-s2
          titles: { translations: { en: Unlimited Blade Works } }
          number: 2
          externalIds: { anilistId: 19603 } # Unlimited Blade Works (2014)
      movies:
        - id: fate-stay-night-hf-1
          titles: { translations: { en: Heaven's Feel I } }
          externalIds: { anilistId: 20791 } # Heaven's Feel I (2017)
    - id: fate-zero
      titles: { original: Fate/Zero }
      seasons:
        - id: fate-zero-s1
          number: 1
          part: 1
        - id: fate-zero-s2
          number: 1
          part: 2
    # A separate continuity (a Fake Holy Grail War in Snowfield), so its own
    # Series under the franchise rather than a season of stay night or Zero.
    - id: fate-strange-fake
      titles: { original: Fate/strange Fake }
      seasons:
        - id: fate-strange-fake-s1
          # Authored: upstream stopped listing these under the series' own title,
          # so the build can no longer resolve them.
          externalIds: { anilistId: 166617 }
          number: 1
  # Release order is the default (derived from release dates); only the curated
  # in-universe order is stored.
  watchOrders:
    - name: Chronological
      entries:
        - { ref: fate-zero }
        - { ref: fate-stay-night }
  # Cast (R2) nested under the franchise; names filled from Wikidata (CC0).
  characters:
    - id: artoria-pendragon
      externalIds: { wikidataId: Q4918886 } # Saber
      # Ayako Kawasumi voices Saber in every adaptation, so she belongs to the
      # character. The English dubs do not — Saber was recast for each — so they
      # belong to the appearance they were cast in. An appearance's cast adds to
      # the character's rather than replacing it, so the Japanese voice does not
      # have to be restated here.
      #
      # Which appearance each English credit belongs to comes from Wikidata's
      # "applies to work" (P10663) on the voice-actor statement, and it is more
      # specific than the series: Kate Higgins's names the 2006 TV series alone,
      # not the 2014 re-adaptation or the Heaven's Feel films that this same
      # series id also holds, so her appearance is scoped to that season. Those
      # other installments get their own appearance with no English cast. That
      # is a gap in the source, not in the import: Wikidata's Saber item
      # (Q4918886) carries exactly three English voice-actor statements — the
      # 2006 TV series, the 2010 film and Fate/Zero — and none of them names the
      # 2014 re-adaptation (Q19980978) or Heaven's Feel I (Q66777794). She is
      # certainly voiced in both; nothing we may redistribute says by whom. The
      # same item also carries Cantonese, Mandarin and Korean casts, which this
      # dataset does not record yet.
      # Michelle Ruff is absent for the same reason in the opposite direction:
      # hers applies to the 2010 Unlimited Blade Works film (Q3740068), which
      # this dataset does not carry at all. Add her with that film, not before.
      voiceActors:
        - { staffId: ayako-kawasumi, language: ja }
      appearances:
        - seriesId: fate-stay-night
          scope: [{ seasonId: fate-stay-night-s1 }] # 2006 TV series (Q60987686)
          voiceActors:
            - { staffId: kate-higgins, language: en }
        - seriesId: fate-stay-night
          scope:
            - { seasonId: fate-stay-night-s2 } # Unlimited Blade Works (2014)
            - { movieId: fate-stay-night-hf-1 } # Heaven's Feel I (2017)
        - seriesId: fate-zero # Q96500220 — one story across both cours
          voiceActors:
            - { staffId: kari-wahlgren, language: en }
    # Imported from Wikidata's P1441 (present in work) on each series. A
    # character in more than one Fate series is one node with an appearance
    # per series, the way Saber above is: the franchise holds the cast.
    #
    # The shared characters carry Japanese cast only. Their English credits
    # have no P10663 saying which adaptation they belong to, and stay night
    # and Zero are different adaptations, so attributing one to either would
    # be a guess. Saber keeps hers because hers does carry the qualifier.
    - id: archer
      externalIds: { wikidataId: Q3543951 }  # Archer
      voiceActors:
        - { staffId: junichi-suwabe, language: ja }
        - { staffId: liam-obrien, language: en }  # Liam O'Brien
      appearances:
        - { seriesId: fate-stay-night }
