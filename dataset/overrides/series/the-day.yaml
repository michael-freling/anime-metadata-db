# Authored override — 2018 catalogue import. Holds only the structure the
# open sources cannot express; `builder build` fills the facts into data/.
# Never hand-edit data/.
series:
  id: the-day
  titles:
    original: the day
    translations: { ja-Latn: the day }
  movies:
    - id: the-day-film
# One linear storyline: episodes carry a continuous absoluteNumber.
numbered: [the-day]
