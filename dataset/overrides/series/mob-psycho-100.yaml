# Authored override. The catalogue carried "mob-psycho-100-ii" as a series of
# its own — a second season given its own record, which left the third unable
# to attach to either: its title extends both names. One series, three seasons.
series:
  id: mob-psycho-100
  titles:
    original: モブサイコ100
    translations: { ja-Latn: Mob Psycho 100 }
  seasons:
    - id: mob-psycho-100-s1
      number: 1
      externalIds: { anilistId: 21507 } # Mob Psycho 100 (2016)
    - id: mob-psycho-100-s2
      number: 2
      externalIds: { anilistId: 101338 } # Mob Psycho 100 II (2019)
    - id: mob-psycho-100-s3
      number: 3
      externalIds: { anilistId: 140439 } # Mob Psycho 100 III (2022)
# One linear storyline: episodes carry a continuous absoluteNumber.
numbered: [mob-psycho-100]
