# Authored override — 2015 catalogue import. Holds only the structure the
# open sources cannot express; `builder build` fills the facts into data/.
# Never hand-edit data/.
series:
  id: track
  titles:
    original: TRACK
    translations: { ja-Latn: TRACK }
