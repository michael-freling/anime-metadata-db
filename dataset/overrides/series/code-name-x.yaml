# Authored override — 2023 catalogue import. Holds only the structure the
# open sources cannot express; `builder build` fills the facts into data/.
# Never hand-edit data/.
series:
  id: code-name-x
  titles:
    original: Code Name X
    translations: { ja-Latn: Code Name X }
  seasons:
    - id: code-name-x-s1
      number: 1
# One linear storyline: episodes carry a continuous absoluteNumber.
numbered: [code-name-x]
