# Authored override (Demon Slayer) — see docs/proposals "Build CLI Design".
# Holds only the structure + decisions the open sources cannot express. The
# builder fills facts (titles, dates, episode counts) and computes
# absoluteNumber, writing the resolved record to data/. Never hand-edit data/.
#
# Node ids are prefixed with the series id so they stay unambiguous across the
# dataset (e.g. demon-slayer-s1 rather than ds-s1).
series:
  id: demon-slayer
  # A Series/Franchise is our own grouping with no entry in the open sources, so
  # its title must be authored (a Season/Movie auto-fills from its source).
  titles: { original: 鬼滅の刃, translations: { en: Demon Slayer } }
  seasons:
    - id: demon-slayer-s1
      number: 1
      # Authored: upstream does not list this under the series' own title, so
      # the build cannot resolve it. Everywhere else the id is resolved.
      externalIds: { anilistId: 101922 } # Kimetsu no Yaiba (2019)
    - id: demon-slayer-s2
      titles: { translations: { en: Mugen Train Arc } }
      number: 2
      externalIds: { anilistId: 129874 } # Mugen Ressha-hen (TV, 2021)
    - id: demon-slayer-s3
      titles: { translations: { en: Entertainment District Arc } }
      number: 3
      externalIds: { anilistId: 142329 } # Yuukaku-hen (2021-2022)
    - id: demon-slayer-s4
      titles: { translations: { en: Swordsmith Village Arc } }
      number: 4
      externalIds: { anilistId: 145139 } # Katanakaji no Sato-hen (2023)
    - id: demon-slayer-s5
      titles: { translations: { en: Hashira Training Arc } }
      number: 5
      externalIds: { anilistId: 166240 } # Hashira Geiko-hen (2024)
  movies:
    # Alternate cut of the Mugen Train Arc season — takes no absoluteNumber.
    - id: demon-slayer-mugen-train-film
      titles: { translations: { en: Mugen Train } }
      externalIds: { anilistId: 112151 } # film (2020)
      alternateCutOf: { seasonId: demon-slayer-s2 }
    # Original film — takes its own slot in the numbered run.
    - id: demon-slayer-infinity-castle-1
      titles: { translations: { en: Infinity Castle } }
      externalIds: { anilistId: 178788 } # Mugenjou-hen Movie 1 (2025)
    # Compilation recuts, authored by their AniDB id because upstream carries
    # none of them on AniList. Each is an alternateCutOf the season it retells,
    # so none takes a slot in the absolute run — the episodes are already
    # numbered once, in the season itself.
    - id: demon-slayer-natagumo-yama-film
      titles: { original: 鬼滅の刃 那田蜘蛛山編, translations: { en: Mount Natagumo Arc } }
      externalIds: { anidbId: 16259 } # Natagumo Yama Hen (2020)
      alternateCutOf: { seasonId: demon-slayer-s1 }
    - id: demon-slayer-hashira-gou-kaigi-film
      titles: { original: 鬼滅の刃 柱合会議・蝶屋敷編, translations: { en: Hashira Meeting and Butterfly Mansion Arc } }
      externalIds: { anidbId: 16258 } # Hashira Gou Kaigi - Chouyashiki Hen (2020)
      alternateCutOf: { seasonId: demon-slayer-s1 }
    - id: demon-slayer-katanakaji-no-sato-film
      titles: { original: 鬼滅の刃 刀鍛冶の里 敵襲編, translations: { en: "Swordsmith Village Arc (special edition)" } }
      externalIds: { anidbId: 18529 } # Katanakaji no Sato-hen Tokubetsu Henshuu (2024)
      alternateCutOf: { seasonId: demon-slayer-s4 }
    - id: demon-slayer-hashira-geiko-film
      titles: { original: 鬼滅の刃 柱稽古 柱結集編, translations: { en: "Hashira Training Arc (special edition)" } }
      externalIds: { anidbId: 19418 } # Hashira Geiko Hen Tokubetsu Henshuu (2025)
      alternateCutOf: { seasonId: demon-slayer-s5 }
  # Cast (R2) nested under the series; names filled from Wikidata (CC0).
  characters:
    # No appearances needed: a character nested under a standalone series
    # defaults to appearing in that whole series. Add an appearances entry only
    # to scope to specific seasons or to reference another series.
    - id: tanjiro-kamado
      externalIds: { wikidataId: Q85805158 }
      voiceActors:
        - { staffId: natsuki-hanae, language: ja }
        - { staffId: zach-aguilar, language: en }
    - id: aoi-kanzaki
      externalIds: { wikidataId: Q123515824 }  # Aoi Kanzaki
      voiceActors:
        - { staffId: reba-buhr, language: en }
        - { staffId: yuri-ehara, language: ja }
    - id: genya-shinazugawa
      externalIds: { wikidataId: Q123515829 }  # Genya Shinazugawa
    - id: giyu-tomioka
      externalIds: { wikidataId: Q130425850 }  # Giyū Tomioka
      voiceActors:
        - { staffId: johnny-yong-bosch, language: en }
        - { staffId: takahiro-sakurai, language: ja }
    - id: inosuke-hashibira
      externalIds: { wikidataId: Q109321822 }  # Inosuke Hashibira
      voiceActors:
        - { staffId: yoshitsugu-matsuoka, language: ja }
    - id: kagaya-ubuyashiki
      externalIds: { wikidataId: Q123515823 }  # Kagaya Ubuyashiki
      voiceActors:
        - { staffId: matthew-mercer, language: en }
        - { staffId: toshiyuki-morikawa, language: ja }
    - id: kanao-tsuyuri
      externalIds: { wikidataId: Q123515825 }  # Kanao Tsuyuri
      voiceActors:
        - { staffId: brianna-knickerbocker, language: en }
        - { staffId: reina-ueda, language: ja }
    - id: kanata-ubuyashiki
      externalIds: { wikidataId: Q123515826 }  # Kanata Ubuyashiki
      voiceActors:
        - { staffId: mela-lee, language: en }
        - { staffId: shiori-izawa, language: ja }
    - id: makomo
      externalIds: { wikidataId: Q123515827 }  # Makomo
      voiceActors:
        - { staffId: ai-kakuma, language: ja }
        - { staffId: ryan-bartley, language: en }
    - id: muzan-kibutsuji
      externalIds: { wikidataId: Q116252649 }  # Muzan Kibutsuji
    - id: nezuko-kamado
      externalIds: { wikidataId: Q109767984 }  # Nezuko Kamado
      voiceActors:
        - { staffId: akari-kito, language: ja }
    - id: sabito
      externalIds: { wikidataId: Q123515830 }  # Sabito
    - id: sakonji-urokodaki
      externalIds: { wikidataId: Q123515828 }  # Sakonji Urokodaki
      voiceActors:
        - { staffId: brook-chalmers, language: en }
