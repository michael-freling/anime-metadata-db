# Authored override — 2016 catalogue import. Holds only the structure the
# open sources cannot express; `builder build` fills the facts into data/.
# Never hand-edit data/.
series:
  id: berserk
  titles:
    original: ベルセルク
    translations: { ja-Latn: Berserk }
  seasons:
    - id: berserk-s1
      number: 1
    - id: berserk-s2
      number: 2
    - id: berserk-s3
      number: 3
# No continuous absoluteNumber. The seasons above are separate adaptations of
# one work (1997, 2016, 2017), not one run, so numbering them end to end would
# assert a continuity that does not exist.
