# Authored override — 2011 catalogue import. Holds only the structure the
# open sources cannot express; `builder build` fills the facts into data/.
# Never hand-edit data/.
series:
  id: creator
  titles:
    original: creator
    translations: { ja-Latn: creator }
  movies:
    - id: creator-film
# One linear storyline: episodes carry a continuous absoluteNumber.
numbered: [creator]
