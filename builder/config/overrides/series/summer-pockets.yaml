# Authored override — 2025 catalogue import. Holds only the structure the
# open sources cannot express; `builder build` fills the facts into data/.
# Never hand-edit data/.
series:
  id: summer-pockets
  titles:
    original: サマーポケッツ
    translations: { ja-Latn: Summer Pockets }
  seasons:
    - id: summer-pockets-s1
      number: 1
  movies:
    - id: summer-pockets-film
      # A recut of the season, so it takes no absoluteNumber of its own.
      alternateCutOf: { seasonId: summer-pockets-s1 }
# One linear storyline: episodes carry a continuous absoluteNumber.
numbered: [summer-pockets]
