# golangci-lint v2 configuration.
# Docs: https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 5m
  # Also analyze the build-tagged e2e tests.
  build-tags:
    - e2e

linters:
  # Start from the curated standard set (errcheck, govet, ineffassign,
  # staticcheck, unused) and add a few high-signal extras.
  default: standard
  enable:
    - revive
    - misspell
    - unconvert
    - gocritic
  settings:
    errcheck:
      # Writes to the user-facing output writer are best-effort.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    generated: lax
    # The repository root is a Go module, so a run from there also walks web/,
    # which carries Go sources shipped inside npm packages. They are nobody's
    # code here and would be judged by this project's style rules.
    paths:
      - web/
    rules:
      # Test files may skip error checks on helpers and use dot-style fixtures.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    # Generated protobuf/Connect code under internal/gen/ is not ours to format.
    generated: lax
    paths:
      - internal/gen
  settings:
    goimports:
      local-prefixes:
        - github.com/michael-freling/anime-metadata-db
