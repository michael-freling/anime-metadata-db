name: Go

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.6.0
  # Minimum total test coverage (percent) required to pass CI.
  COVERAGE_THRESHOLD: "95"
  # Pinned protobuf toolchain for the generated-code drift check.
  BUF_VERSION: v1.71.0

jobs:
  proto:
    name: Protobuf codegen up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The web app's TypeScript client is generated from the same schema, so
      # its protoc-gen-es plugin has to be present for `buf generate` to run at
      # all — it lives in web/node_modules, not GOPATH.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the TypeScript codegen plugin
        run: npm ci
        working-directory: web

      # The plugins are installed from api/, deliberately: an unversioned
      # `go install` resolves the version from the current module, and only
      # api/ requires protobuf and connect. Run from the root — which now
      # requires neither — it would pick whatever is latest and stamp the
      # generated files with a version that never matches the committed ones.
      - name: Install buf and protoc plugins
        run: |
          go install "github.com/bufbuild/buf/cmd/buf@${BUF_VERSION}"
          (cd api && go install google.golang.org/protobuf/cmd/protoc-gen-go)
          (cd api && go install connectrpc.com/connect/cmd/protoc-gen-connect-go)
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Checks BOTH generated trees, so a proto change that updates the Go
      # server but leaves the TypeScript client stale fails here rather than
      # showing up as a type error in the web build.
      - name: Regenerate and verify no diff
        run: |
          (cd api && buf generate)
          if ! git diff --exit-code -- api/internal/gen web/src/lib/gen; then
            echo "::error::generated code is out of date; run 'make generate' and commit the result."
            exit 1
          fi

  pagination:
    name: Every response is bounded
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The dataset is built to hold the full upstream catalogue, so a response
      # that returns a whole collection is an outage waiting for the data to
      # catch up. The failure is invisible at today's row counts — a list that
      # is complete at 150 and ruinous at 150,000 reads identically in review —
      # so it is asserted rather than reviewed.
      # This checks the schema; TestNoResponseEmbedsAnUnboundedCollection in
      # internal/api checks the responses the server actually builds.
      - name: Test the check itself
        run: node .claude/skills/enforce-pagination/scripts/check-pagination.test.mjs

      - name: Verify no response is unbounded
        run: node .claude/skills/enforce-pagination/scripts/check-pagination.mjs

  index:
    name: Listing index matches the dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # data/index.tsv is generated from data/ and embedded in the API binary.
      # Nothing regenerates it at deploy time — Vercel just runs `go build` —
      # so a dataset change that forgets `make index` would ship a server
      # describing the previous dataset. Regenerating here and diffing is what
      # makes that impossible to merge.
      - name: Verify data/index.tsv is up to date
        run: |
          if ! make index-check; then
            echo "::error::data/index.tsv is stale; run 'make index' and commit the result."
            exit 1
          fi

  lint:
    name: golangci-lint v2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "${{ runner.temp }}/golangci" "${GOLANGCI_LINT_VERSION}"

      # Each module is linted on its own: golangci-lint resolves types per
      # module, and a repo-wide run would silently skip the ones it could not
      # load rather than fail.
      - name: Lint
        run: |
          for mod in . api builder; do
            echo "--- $mod"
            (cd "$mod" && "${{ runner.temp }}/golangci/golangci-lint" run ./...)
          done

  test:
    name: Test & coverage (>95%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      # One profile per module, merged before the threshold is applied, so the
      # figure means the same thing it did when this was a single module.
      #
      # -coverpkg spans all three modules, because a test in one legitimately
      # covers code in another: api's tests exercise internal/model, and
      # crediting that only to the module the test lives in would understate
      # both. It is spelled out subtree by subtree rather than as a single
      # wildcard: the repo root is a Go module, so a bare .../... also matches
      # the Go sources that ship inside web/node_modules, which are nobody's
      # code and drag the total down by six points when npm has run.
      - name: Run tests with coverage
        run: |
          set -euo pipefail
          M=github.com/michael-freling/anime-metadata-db
          # A module can only instrument packages it requires. There is no
          # go.work, so naming api/ from the root module resolves nothing and
          # the profile comes back empty — which reads as 0% coverage rather
          # than as an error.
          root="$M,$M/internal/..."
          for mod in . api builder; do
            case "$mod" in
              .) pkgs="$root"; out=root-cover.out ;;
              *) pkgs="$root,$M/$mod/..."; out="$mod-cover.out" ;;
            esac
            (cd "$mod" && go test -race -covermode=atomic \
               -coverpkg="$pkgs" -coverprofile="$out" ./...)
          done
          # Merge by summing each block's hit count. Concatenating would list a
          # block once per module that had it in -coverpkg, and the runs that
          # never executed it contribute a zero that reads as missing coverage.
          awk '
            /^mode:/ { next }
            { key = $1 " " $2
              if (!(key in seen)) { order[++n] = key; seen[key] = 1 }
              count[key] += $3 }
            END { print "mode: atomic"
                  for (i = 1; i <= n; i++) print order[i], count[order[i]] }
          ' root-cover.out api/api-cover.out builder/builder-cover.out > coverage.out

      - name: Enforce coverage threshold
        run: |
          # Generated protobuf/Connect code under internal/gen/ is excluded: it
          # is not hand-written and carries no tests, so it should not count
          # toward the threshold. The "mode:" header line is preserved.
          grep -v '/internal/gen/' coverage.out > coverage.filtered
          # Summed straight from the profile rather than via `go tool cover`,
          # which loads every package it reports on and so has to run inside a
          # module that can resolve them all — no module here can, and without
          # a go.work it fails rather than reporting a number. On a merged
          # profile the arithmetic is what `go tool cover -func` prints as its
          # total; verified identical before this replaced it.
          total="$(awk '!/^mode:/ { statements += $2; if ($3 > 0) covered += $2 }
                        END { printf "%.1f", 100 * covered / statements }' coverage.filtered)"
          echo "Total coverage (excluding internal/gen/): ${total}%"
          awk -v total="$total" -v min="${COVERAGE_THRESHOLD}" 'BEGIN {
            if (total+0 > min+0) {
              printf "Coverage %.1f%% exceeds the %s%% threshold.\n", total, min
              exit 0
            }
            printf "::error::Coverage %.1f%% does not exceed the required %s%%.\n", total, min
            exit 1
          }'
