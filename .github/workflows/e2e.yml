name: E2E

# The e2e tests download the real open-data sources over the network and run
# the full init -> build pipeline, so they catch upstream URL/source drift
# (like a moved release asset) on every PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (live sources)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Per module. Run from the repository root this matches only the root
      # module — which holds the dataset and nothing else — so it passed
      # vacuously from the moment the Go code moved into api/ and builder/,
      # reporting success having executed no test at all.
      - name: Run e2e tests (no mocks)
        run: |
          set -euo pipefail
          for mod in . api builder; do
            echo "--- $mod"
            (cd "$mod" && go test -tags e2e -run E2E -timeout 15m ./...)
          done

  reproducible:
    name: data/ is reproducible from the overrides
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The unit tests build in synthetic temp directories, so nothing until now
      # ran the builder against the checked-in config.yaml, overrides and
      # sources. That gap hid a real incident: after the module split,
      # config.yaml's sourcesDir/dataDir pointed at the wrong tree and a full
      # build deleted every record in data/ as orphaned, exiting 0. The builder
      # now refuses that, but only this job proves the committed configuration
      # actually produces the committed dataset.
      #
      # It runs here rather than in go.yml because it downloads the real pinned
      # sources. That also means upstream drift under a pinned URL shows up as a
      # diff — which is true and worth knowing: it says data/ is no longer
      # reproducible and needs rebuilding.
      - name: Fetch the pinned sources
        run: make init

      - name: Rebuild data/ from the committed overrides
        run: make build-data

      - name: The rebuild must change nothing
        run: |
          if ! git diff --exit-code --stat -- data/; then
            echo "::error::rebuilding from builder/config/overrides changed data/ — commit the rebuild, or a source has drifted"
            exit 1
          fi
          echo "data/ matches what the builder produces from the committed overrides"

      # A prune that removes everything is the failure this job exists for, so
      # assert it separately from the diff: a build that deleted the dataset and
      # a build that never ran both leave `git diff` looking wrong in ways that
      # are easy to misread.
      - name: The rebuild must not have pruned records
        run: |
          test -s data/index.tsv || { echo "::error::data/index.tsv is missing after the rebuild"; exit 1; }
          count=$(find data/series -name '*.yaml' | wc -l)
          echo "series records after the rebuild: $count"
          test "$count" -gt 0 || { echo "::error::the rebuild left data/series empty"; exit 1; }
