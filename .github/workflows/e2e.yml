name: E2E

# The e2e tests download the real open-data sources over the network and run
# the full init -> build pipeline, so they catch upstream URL/source drift
# (like a moved release asset) on every PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (live sources)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Per module. Run from the repository root this matches only the root
      # module — which holds the dataset and nothing else — so it passed
      # vacuously from the moment the Go code moved into api/ and builder/,
      # reporting success having executed no test at all.
      - name: Run e2e tests (no mocks)
        run: |
          set -euo pipefail
          for mod in . api builder; do
            echo "--- $mod"
            (cd "$mod" && go test -tags e2e -run E2E -timeout 15m ./...)
          done

  reproducible:
    name: A full build produces records and deletes none
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The unit tests build in synthetic temp directories, so nothing else
      # runs the builder against the checked-in config.yaml, overrides and
      # sources. That gap hid a real incident: after the module split,
      # config.yaml's sourcesDir/dataDir pointed at the wrong tree and a full
      # build deleted every record in data/ as orphaned, exiting 0.
      #
      # What this job does NOT do is diff the rebuild against data/. The two
      # large sources are rolling — their URLs name "master" and "latest", and
      # config.yaml's sha256 records what was last seen rather than addressing
      # a version that can be fetched again. A clean runner therefore always
      # downloads newer upstream data than data/ was built from, and `init`
      # re-pins accordingly, so a byte-comparison would fail permanently for
      # reasons no pull request caused. (Asked for one anyway, it produced a
      # 41-file diff on its first run.)
      #
      # What holds regardless of upstream is that a full build produces records
      # and removes none: a record disappears only when its override does, so a
      # deletion here means the build could not see the overrides — which is
      # exactly the failure this job exists to catch.
      - name: Fetch the sources
        run: make init

      - name: Rebuild data/ from the committed overrides
        run: make build-data 2>&1 | tee /tmp/build.log

      - name: The rebuild must not delete records
        run: |
          set -euo pipefail
          test -s /tmp/build.log || { echo "::error::the build produced no output"; exit 1; }
          if grep -q "removed orphaned" /tmp/build.log; then
            echo "::error::the build pruned records — the overrides were not found where config.yaml says they are"
            grep "removed orphaned" /tmp/build.log | head -20
            exit 1
          fi
          if deleted=$(git diff --diff-filter=D --name-only -- data/) && [ -n "$deleted" ]; then
            echo "::error::the rebuild deleted records from data/"
            echo "$deleted" | head -20
            exit 1
          fi
          # Deliberately counts *.yaml under data/series and nothing else.
          # data/index.tsv would be a tempting thing to check, but the prune
          # only walks *.yaml/*.yml and `builder build` never touches the index
          # — it would have survived the original incident untouched and proved
          # nothing.
          count=$(find data/series -name '*.yaml' | wc -l)
          echo "series records after the rebuild: $count"
          test "$count" -gt 0 || { echo "::error::the rebuild left data/series empty"; exit 1; }

      # Informational: upstream moved, so this is expected to be non-empty and
      # is what a dataset refresh would commit. It is printed rather than
      # asserted for the reason above.
      - name: Report how far data/ has drifted from upstream
        run: |
          if git diff --quiet -- data/; then
            echo "data/ still matches what today's upstream produces"
          else
            git diff --stat -- data/ | tail -5
            echo "::notice::upstream has moved since data/ was last rebuilt; run 'make init && make build-data' to refresh it"
          fi
