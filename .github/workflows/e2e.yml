name: E2E

# The e2e tests download the real open-data sources over the network and run
# the full init -> build pipeline, so they catch upstream URL/source drift
# (like a moved release asset) on every PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (live sources)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Per module. Run from the repository root this matches only the root
      # module — which holds the dataset and nothing else — so it passed
      # vacuously from the moment the Go code moved into api/ and builder/,
      # reporting success having executed no test at all.
      - name: Run e2e tests (no mocks)
        run: |
          set -euo pipefail
          for mod in . api builder; do
            echo "--- $mod"
            (cd "$mod" && go test -tags e2e -run E2E -timeout 15m ./...)
          done

  reproducible:
    name: A full build produces records and deletes none
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The unit tests build in synthetic temp directories, so nothing else
      # runs the builder against the checked-in config.yaml, overrides and
      # sources. That gap hid a real incident: after the module split,
      # config.yaml's sourcesDir/dataDir pointed at the wrong tree and a full
      # build deleted every record in data/ as orphaned, exiting 0.
      #
      # What this job does NOT do is diff the rebuild against data/. The two
      # large sources are rolling — their URLs name "master" and "latest", and
      # config.yaml's sha256 records what was last seen rather than addressing
      # a version that can be fetched again. A clean runner therefore always
      # downloads newer upstream data than data/ was built from, and `init`
      # re-pins accordingly, so a byte-comparison would fail permanently for
      # reasons no pull request caused. (Asked for one anyway, it produced a
      # 41-file diff on its first run.)
      #
      # What holds regardless of upstream is that a full build produces records
      # and removes none: a record disappears only when its override does, so a
      # deletion here means the build could not see the overrides — which is
      # exactly the failure this job exists to catch.
      # Cached so this job does not add a second unconditional 61 MB download
      # to every pull request. The key is the committed config.yaml, which
      # holds the pins, so a change to what is pinned fetches afresh and
      # everything else reuses. `init` still verifies what it restores, and
      # re-fetches anything missing, so a stale or partial cache cannot make
      # the job pass on the wrong inputs.
      - name: Cache the source downloads
        uses: actions/cache@v4
        with:
          path: .sources
          key: sources-${{ hashFiles('builder/config.yaml') }}
          restore-keys: sources-

      - name: Fetch the sources
        run: make init

      - name: Rebuild data/ from the committed overrides
        run: make build-data 2>&1 | tee /tmp/build.log

      - name: The rebuild must leave data/ whole
        run: |
          set -euo pipefail
          test -s /tmp/build.log || { echo "::error::the build produced no output"; exit 1; }
          # Deliberately not "did the build prune anything". Pruning a few
          # records whose overrides were deleted is ordinary, and the builder
          # allows it without a flag; failing on any prune at all would be
          # stricter than the tool and would blame a wrong overridesDir for
          # something else entirely. A build that really is misconfigured
          # refuses on its own and fails the step above.
          #
          # What is wrong is a deletion relative to what is committed: it means
          # data/ holds records whose overrides are gone, so somebody removed
          # overrides without rebuilding.
          if deleted=$(git diff --diff-filter=D --name-only -- data/) && [ -n "$deleted" ]; then
            echo "::error::rebuilding deleted records that are still committed — an override was removed without running 'make build-data'"
            echo "$deleted" | head -20
            exit 1
          fi
          # Deliberately counts *.yaml under data/series and nothing else.
          # data/index.tsv would be a tempting thing to check, but the prune
          # only walks *.yaml/*.yml and `builder build` never touches the index
          # — it would have survived the original incident untouched and proved
          # nothing.
          count=$(find data/series -name '*.yaml' | wc -l)
          echo "series records after the rebuild: $count"
          test "$count" -gt 0 || { echo "::error::the rebuild left data/series empty"; exit 1; }

      # The anilistId checks report rather than fail the build, because which
      # installments make up a series is editorial and upstream's links move.
      # That makes CI the place they are enforced: without this the notes go to
      # a log nobody reads, and a wrong id lands as silently as before.
      - name: No anilistId looks misplaced
        run: |
          set -euo pipefail
          # The provenance line proves the checks ran at all. Asserting only the
          # absence of findings would pass just as happily if they never
          # executed, which is the failure this pair exists to tell apart.
          grep -qE '^anilistId provenance: ' /tmp/build.log || {
            echo "::error::the build printed no anilistId provenance line, so the checks did not run"
            exit 1
          }
          grep -A5 -E '^anilistId provenance: ' /tmp/build.log

          # Most ids are resolved from the series' own title rather than read
          # from an override. Asserting that something was resolved keeps the
          # resolution from silently degrading into a pass-through: if upstream
          # changed such that nothing resolved, every id would fall back to an
          # override that no longer exists and the build would fail — but if it
          # were ever made non-fatal, this is what would notice.
          derived=$(sed -n "s|^  \([0-9]*\)/[0-9]* resolved from the series' own title$|\1|p" /tmp/build.log)
          echo "ids resolved from the series' own title: ${derived:-0}"
          test "${derived:-0}" -gt 0 || {
            echo "::error::no anilistId was resolved from a series title; the resolution has stopped working"
            exit 1
          }

          # The report's own count of hand-authored ids must equal what is
          # actually in the overrides. They are counted by different code over
          # different inputs, so agreement means the figure the project steers
          # by is measuring the tree rather than restating itself.
          reported=$(sed -n 's|^  \([0-9]*\)/[0-9]* read from an override$|\1|p' /tmp/build.log)
          actual=$(grep -rho 'anilistId' builder/config/overrides/ | wc -l)
          echo "authored ids: $reported reported, $actual in the overrides"
          test "$reported" = "$actual" || {
            echo "::error::the build reports $reported authored anilistIds but the overrides hold $actual"
            exit 1
          }
          # Which findings are worth failing a merge for is decided in Go, next
          # to the checks that raise them (see `gating` in build/report.go), and
          # the builder counts them. This asserts that count is zero.
          #
          # Asserting something positive is the point. The gate used to grep the
          # notes for three English fragments, and a pattern that matches
          # nothing is indistinguishable from a catalogue with nothing wrong —
          # so a rewording silently retired it, twice, while this feature was
          # being built. If the line below ever stops being printed in this
          # shape, this step goes red instead of quietly passing forever.
          if ! grep -qx 'gating findings: 0' /tmp/build.log; then
            echo "::error::the build raised findings that must not merge:"
            grep -x 'gating findings: [0-9]*' /tmp/build.log || true
            grep -x 'finding codes: .*' /tmp/build.log || true
            grep -nE 'anilistId' /tmp/build.log | grep -E 'externalIds' || true
            exit 1
          fi

      # A check that is silent on a clean catalogue is indistinguishable from a
      # check that does not work. The unit tests exercise the algorithm against
      # a four-entry fixture; this exercises it against the real offline
      # database, which is the thing it has to hold up against.
      - name: ...and a planted one is caught
        run: |
          set -euo pipefail
          override=builder/config/overrides/series/sousou-no-frieren.yaml
          # Both of Frieren's ids are resolved, not authored, which is the point
          # of planting here: it tests the one surface still open to a typo.
          # Fail loudly if that stops being true, rather than planting an id
          # beside an existing one and "catching" a duplicate instead.
          if grep -q 'anilistId' "$override"; then
            echo "::error::the planted-error fixture is stale: $override now authors an anilistId"
            exit 1
          fi
          # Read the clean build's split first, so the planted run is compared
          # against what this catalogue actually produced rather than a number
          # baked into the workflow that drifts as series are added.
          total=$(sed -n 's|^anilistId provenance: \([0-9]*\) ids$|\1|p' /tmp/build.log)
          derived=$(sed -n "s|^  \([0-9]*\)/[0-9]* resolved from the series' own title$|\1|p" /tmp/build.log)
          authored=$(sed -n 's|^  \([0-9]*\)/[0-9]* read from an override$|\1|p' /tmp/build.log)
          test -n "$total" && test -n "$derived" && test -n "$authored" || {
            echo "::error::could not read the provenance split from the clean build"; exit 1; }

          # 21 is One Piece: a real entry, so `lookup` still succeeds and only
          # these checks can object to it.
          sed -i '/- id: sousou-no-frieren-s2/{n;a\      externalIds: { anilistId: 21 }
          }' "$override"
          grep -q 'anilistId: 21' "$override" || {
            echo "::error::planting the id did not edit $override"
            exit 1
          }
          make build-data 2>&1 | tee /tmp/planted.log || true
          git checkout -- builder/config/overrides/ data/

          # By code rather than by message: these are the same three checks as
          # before, but a rewording of what they say can no longer make this
          # step pass by matching nothing.
          fail=0
          grep -q 'anilist-unlinked' /tmp/planted.log || {
            echo "::error::the relatedAnime check did not catch an id from another series"; fail=1; }
          grep -q 'anilist-out-of-order' /tmp/planted.log || {
            echo "::error::the chronology check did not catch a season that predates the one before it"; fail=1; }
          grep -q 'anilist-title-disagrees' /tmp/planted.log || {
            echo "::error::the title resolution did not disagree with the planted id"; fail=1; }
          # And the gate must actually trip, rather than the codes merely being
          # printed somewhere: this is the assertion the clean build's
          # "gating findings: 0" is the other half of.
          grep -qx 'gating findings: 0' /tmp/planted.log && {
            echo "::error::a planted id did not raise a gating finding"; fail=1; }
          # The planted id is authored, so it must move the provenance split by
          # exactly one in each direction. This is what proves the two figures
          # describe the tree rather than a constant printed beside it.
          grep -q "$((derived - 1))/$total resolved from the series' own title" /tmp/planted.log || {
            echo "::error::planting an id did not reduce the resolved count by one"; fail=1; }
          grep -q "$((authored + 1))/$total read from an override" /tmp/planted.log || {
            echo "::error::planting an id did not raise the authored count by one"; fail=1; }
          test "$fail" -eq 0
          echo "all three checks caught the planted id, and the provenance split moved with it"

      # The duplicate check gates but nothing exercised it end to end: a review
      # found it silently mis-counting a duplicate as "nothing to check
      # against", which unit tests caught only after the fact. It is also the
      # one check the other two cannot stand in for — a duplicated id is
      # trivially linked to, and in order with, itself.
      - name: ...and so is a duplicated one
        run: |
          set -euo pipefail
          override=builder/config/overrides/series/sousou-no-frieren.yaml
          # Re-read from the clean build: each step is its own shell, so a
          # variable set in the previous one would be empty here and the
          # comparison below would silently degrade into matching nothing.
          total=$(sed -n 's|^anilistId provenance: \([0-9]*\) ids$|\1|p' /tmp/build.log)
          test -n "$total" || { echo "::error::could not read the id count from the clean build"; exit 1; }
          # The same id on both seasons. 21 is a real entry, so `lookup`
          # succeeds and only the duplicate check can object to the pairing.
          sed -i '/- id: sousou-no-frieren-s[12]/{n;a\      externalIds: { anilistId: 21 }
          }' "$override"
          test "$(grep -c 'anilistId: 21' "$override")" -eq 2 || {
            echo "::error::planting the duplicate did not edit both seasons of $override"
            exit 1
          }
          make build-data 2>&1 | tee /tmp/dup.log || true
          git checkout -- builder/config/overrides/ data/

          fail=0
          grep -q 'anilist-duplicate' /tmp/dup.log || {
            echo "::error::the duplicate check did not catch one id on two installments"; fail=1; }
          grep -qx 'gating findings: 0' /tmp/dup.log && {
            echo "::error::a duplicated id did not raise a gating finding"; fail=1; }
          # Both installments stay in the denominator and neither is filed as
          # unverifiable: the series has two, and they were checked and failed.
          grep -q "^anilistId provenance: $total ids$" /tmp/dup.log || {
            echo "::error::a duplicate changed how many ids were considered"; fail=1; }
          test "$fail" -eq 0
          echo "the duplicate check caught one id on two installments"

      # Informational: upstream moved, so this is expected to be non-empty and
      # is what a dataset refresh would commit. It is printed rather than
      # asserted for the reason above.
      - name: Report how far data/ has drifted from upstream
        run: |
          if git diff --quiet -- data/; then
            echo "data/ still matches what today's upstream produces"
          else
            git diff --stat -- data/ | tail -5
            echo "::notice::upstream has moved since data/ was last rebuilt; run 'make init && make build-data' to refresh it"
          fi
