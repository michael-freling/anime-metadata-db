name: Dataset diff

# What a change to the builder does to the dataset, computed rather than
# claimed. Both sides are rebuilt from their own overrides with their own
# builder, so a code change that alters the output shows up even when
# dataset/data/ was never recommitted — which a diff of the committed files
# cannot see.
on:
  pull_request:
    paths:
      - 'src/builder/**'
      - 'src/animedb/**'
      - 'dataset/**'
      - '.github/workflows/dataset-diff.yml'

# One comment, edited in place. Without this a busy pull request accumulates a
# diff per push and the newest is the hardest to find.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dataset-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diff:
    name: What this changes in dataset/data/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/animedb/go.mod

      - name: Fetch the sources
        run: make init

      - name: Build the dataset as this branch produces it
        run: make build-data

      # The base is built in a worktree so it gets its own overrides *and* its
      # own builder. Rebuilding the base with this branch's builder would
      # compare the overrides only, and miss the case this exists for.
      #
      # .sources is symlinked rather than re-fetched: it is gitignored, so the
      # worktree has none, and downloading 60MB twice to compare against itself
      # is the same inputs at twice the cost.
      - name: Build the dataset as the base branch produces it
        run: |
          set -euo pipefail
          git worktree add /tmp/base "origin/${{ github.base_ref }}"
          ln -s "$PWD/.sources" /tmp/base/.sources
          make -C /tmp/base build-data

      - name: Compare
        run: |
          set -euo pipefail
          # GitHub refuses a comment body over 65,536 characters, and a diff
          # line per record passes that at about five thousand: the 2010-2019
          # import produced 5,331 and the post step failed with
          # "GraphQL: Body is too long". The whole diff goes to the job log,
          # which has no such limit, and the comment carries the summary — the
          # line that actually gets read — plus as much detail as fits.
          (cd src/builder && go run ./cmd/builder diff --base /tmp/base/dataset/data) > /tmp/diff.txt
          echo "--- full diff ---"
          cat /tmp/diff.txt

          # The builder prints its summary first, so a head-shaped cut keeps the
          # part that matters. Cut on a line boundary, and leave room for the
          # fences and the note below.
          budget=60000
          total=$(wc -l < /tmp/diff.txt)
          {
            echo '<!-- dataset-diff -->'
            echo '### Dataset diff'
            echo
            echo 'Both sides rebuilt from their own overrides with their own builder.'
            echo
            echo '```'
            # total is passed in because awk's NR after `exit` is the line it
            # stopped at, not the file's length — the first version of this
            # reported "1 more lines" for five thousand of them.
            awk -v budget="$budget" -v total="$total" '
              { used += length($0) + 1 }
              used > budget { printf "\n... %d more lines; the full diff is in the job log.\n", total - NR + 1; exit }
              { print }
            ' /tmp/diff.txt
            echo '```'
          } > /tmp/diff.md
          wc -c < /tmp/diff.md | xargs -I{} echo "comment body: {} bytes (limit 65536)"

      - name: Post it on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Find this job's own previous comment by its marker rather than by
          # author: the token posts as github-actions, which other workflows
          # also use, and editing one of theirs would destroy it.
          existing=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
            --jq 'map(select(.body | contains("<!-- dataset-diff -->"))) | .[0].id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" \
              -F body=@/tmp/diff.md > /dev/null
            echo "updated comment $existing"
          else
            gh pr comment "$PR" --body-file /tmp/diff.md
          fi
