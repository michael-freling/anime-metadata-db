# Authored override (I Made Friends with the Second Prettiest Girl in My Class)
# — a standalone Series with a single season so far. Holds only the structure
# the open sources cannot express; the builder fills facts (titles, dates,
# episode counts) from the pinned sources and writes the resolved record to
# data/. Never hand-edit data/.
#
# Node ids are prefixed with the series id so they stay unambiguous across the
# dataset.
series:
  id: second-prettiest-girl-in-class
  # A Series/Franchise is our own grouping with no entry in the open sources, so
  # its title must be authored (a Season/Movie auto-fills from its source).
  # Abbreviated クラにか (Kuranika) in Japanese.
  titles:
    original: クラスで2番目に可愛い女の子と友だちになった
    translations: { en: I Made Friends with the Second Prettiest Girl in My Class }
  seasons:
    - id: second-prettiest-girl-in-class-s1
      number: 1
      externalIds: { anilistId: 169580 } # Class de 2-banme ni Kawaii Onnanoko to Tomodachi ni Natta (2026)
# One linear storyline, so its episodes carry a continuous absoluteNumber.
numbered: [second-prettiest-girl-in-class]
