# Authored override — Winter/Spring 2026 catalogue import, corrected by hand.
# Stargaze is billed as TRIGUN STAMPEDE 完結編 ("final chapter") and is the direct
# continuation of Stampede, so it is season 2 of one Series rather than a
# separate one. The 1998 Trigun is a different adaptation and is not in scope.
series:
  id: trigun-stampede
  titles:
    original: トライガン スタンピード
    translations: { en: Trigun Stampede }
  seasons:
    - id: trigun-stampede-s1
      number: 1
      externalIds: { anilistId: 151040 } # Trigun Stampede (Winter 2023)
    - id: trigun-stampede-s2
      titles: { translations: { en: Trigun Stargaze } }
      number: 2
      externalIds: { anilistId: 163144 } # Trigun Stargaze (Winter 2026)
  # Cast (R2) discovered from Wikidata (CC0) and nested under the series;
  # the builder fills every name from the QID at build time.
  characters:
    - id: knives-millions
      externalIds: { wikidataId: Q15141139 }  # Knives Millions
    - id: legato-bluesummers
      externalIds: { wikidataId: Q2589453 }  # Legato Bluesummers
    - id: nicholas-d-wolfwood
      externalIds: { wikidataId: Q2374583 }  # Nicholas D. Wolfwood
    - id: rem-saverem
      externalIds: { wikidataId: Q133540657 }  # Rem Saverem
      voiceActors:
        - { staffId: aya-hisakawa, language: ja }  # Aya Hisakawa
        - { staffId: maaya-sakamoto, language: ja }  # Maaya Sakamoto
    - id: vash-the-stampede
      externalIds: { wikidataId: Q2434371 }  # Vash the Stampede
# One linear storyline: episodes carry a continuous absoluteNumber.
numbered: [trigun-stampede]
