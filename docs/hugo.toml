# Hugo configuration for the documentation site using the Hextra theme.
baseURL = '/'
title = 'anime-metadata-db'

# Hextra needs these enabled.
enableInlineShortcodes = true
enableGitInfo = false

# The Hextra theme is pulled in as a Hugo Module (see go.mod).
[module]
  [[module.imports]]
    path = 'github.com/imfing/hextra'

[markup]
  [markup.goldmark.renderer]
    # Allow raw HTML in Markdown (needed by some theme shortcodes).
    unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

# Top navigation bar.
[menu]
  [[menu.main]]
    name = 'Guides'
    pageRef = '/docs'
    weight = 1
  [[menu.main]]
    name = 'Search'
    weight = 2
    [menu.main.params]
      type = 'search'
  [[menu.main]]
    name = 'GitHub'
    weight = 3
    url = 'https://github.com/michael-freling/anime-metadata-db'
    [menu.main.params]
      icon = 'github'

[params]
  [params.navbar]
    displayTitle = true
    displayLogo = false
  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = true
  [params.editURL]
    enable = false
